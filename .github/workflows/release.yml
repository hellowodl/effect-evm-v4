# Creates GitHub releases when package tags (e.g., evm@1.0.0) are pushed.
name: Release

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

env:
  TAG: ${{ github.ref_name }}

on:
  push:
    tags:
      - "evm@*.*.*"

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - name: Parse and validate tag
        id: parse
        run: | #shell
          set -euo pipefail
          PACKAGE="${TAG%@*}"
          VERSION="${TAG#*@}"

          case "$PACKAGE" in
            evm) ;;
            *) echo "::error::Invalid package '$PACKAGE' from tag '$TAG'"; exit 1 ;;
          esac

          if [[ "$VERSION" == *-* ]]; then
            echo "::notice::Skipping prerelease $TAG"
            echo "skip=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          MANIFEST_VERSION="$(node -p "require('./${PACKAGE}/package.json').version")"
          if [[ "$VERSION" != "$MANIFEST_VERSION" ]]; then
            echo "::error::Tag version '$VERSION' does not match package version '$MANIFEST_VERSION'"
            exit 1
          fi

          echo "package=$PACKAGE" >> "$GITHUB_OUTPUT"
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          echo "skip=false" >> "$GITHUB_OUTPUT"
          echo "Releasing $PACKAGE@$VERSION"

          CHANGELOG_PATH="${PACKAGE}/CHANGELOG.md"
          if [[ ! -f "$CHANGELOG_PATH" ]]; then
            echo "::error::Missing CHANGELOG.md for $PACKAGE at $CHANGELOG_PATH"
            exit 1
          fi
          echo "changelog_path=$CHANGELOG_PATH" >> "$GITHUB_OUTPUT"

      - name: Create GitHub release
        if: steps.parse.outputs.skip != 'true'
        uses: docker://antonyurchenko/git-release:v5
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          CHANGELOG_FILE: ${{ steps.parse.outputs.changelog_path }}
          TAG_PREFIX_REGEX: "[a-z0-9-]+@"
          ALLOW_EMPTY_CHANGELOG: "false"
